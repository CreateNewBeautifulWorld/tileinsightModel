# AMD Instinct MI300X (CDNA3, 8 XCDs).  [spec] = AMD figure, [calib] = microbenchmark it.
# NOTE: `sms` means compute units (CU), `memory.onchip.smem` means LDS, and `l2` is modeled as
# the shared Infinity Cache (MALL); the per-XCD 4 MB L2 is not yet a separate level (TASKS H2).
name: MI325X
arch: cdna3
sms: 304                 # [spec] CUs (8 XCD x 38)
clock_ghz: 2.1           # [spec] peak engine clock
dies: 8                  # XCDs
wavefront: 64            # [spec] (informational until the AMD lowering lands, TASKS H2)

compute:
  tc_dense_tflops:       # [spec] matrix core, dense
    fp16: 1307
    bf16: 1307
    fp8: 2615
    int8: 2615           # TOPS
  tc_min_m: 16
  mma_latency_cycles: 64      # [calib] one MFMA tile, issue-to-result
  cuda_latency_cycles: 4      # [calib]
  sfu_latency_cycles: 24      # [calib]           # [spec] MFMA 16x16 / 32x32 tiles
  cta_pair: false
  cuda_fp32_tflops: 163.4   # [spec] vector FP32
  sfu_tops: 10.2         # [spec-derived] CUs x 16 transcendental/clk x clock
efficiency:
  tc: 0.85               # [calib] CK/hipBLASLt reach lower peak fractions than CUTLASS
  cuda: 0.75
  sfu: 0.45              # [calib] paper measured MI210 SFU at ~46% of spec
  ddr: 0.85
  l2: 0.80
  smem: 0.85

memory:
  queueing: {coef: 0.5, max_factor: 3.0}   # [calib] M/D/1-style latency inflation
  outstanding: {per_sm_lines: 256}   # [calib] MSHR-style limit
  dma: {engines: 16, destination: smem}    # [calib] DMA ports per GPU (x memory.dma.port_bytes x clock)
  l1: {owner: sm, capacity_KB: 64, smem_carveout_KB: 0, cluster_size: 1, cache_global_loads: true, capacity_derate: 1.0, bytes_per_clk: 128, latency_cycles: 30, policy: lru}   # derate 1.0 = no loss by default
  interleave_KB: 1       # [calib]
  addressing:            # dump with `tilesight addrmap`
    addr_bits: 48
    l2:  {ports: 32, mode: interleave, granularity_KB: 1}   # [calib]
    ddr: {ports: 8, mode: interleave, granularity_KB: 1}   # [calib/spec] one per stack
  ddr: {capacity_GB: 256, bandwidth_TBps: 6.0, latency_ns: 900}     # [spec] HBM3e
  l2:                    # modeled level = Infinity Cache (MALL)
    capacity_derate: 1.0 # DEFAULT: no loss; lower it only with a measurement
    capacity_MB: 256     # [spec] AMD Infinity Cache
    # effective_capacity_MB: 200   # optional override [calib]
    assoc: 16            # [calib]
    bandwidth_TBps: 17.0 # [spec ~17 TB/s peak]
    latency_ns: 500      # [calib]
    per_sm_max_GBps: 60  # [calib] per-CU global read limit
  onchip:
    smem: {capacity_KB: 64, bytes_per_clk: 128, latency_cycles: 40}    # [spec] LDS per CU

load_paths:
  buffer_lds: {engine: dma, per_sm_bytes_per_clk: 42.86, latency_ns: 120, smem_direct: true, multicast: false, regs_per_thread: 0, issue_bytes_per_clk: 0}   # [calib] global -> LDS direct (buffer_load lds)
  lsu: {engine: lsu, per_sm_bytes_per_clk: 33.33, latency_ns: 80, smem_direct: false, multicast: false, regs_per_thread: 16, issue_bytes_per_clk: 64}           # [calib] via VGPRs
load_paths_default: buffer_lds                     # requests for "tma" fall back here

occupancy:
  max_blocks_per_sm: 16
  max_threads_per_sm: 2048
  regs_per_sm: 131072    # [spec] 512 VGPR x 64 lanes x 4 SIMD (in 4-byte registers)
  max_regs_per_thread: 512

network:
  nvlink: {domain_size: 8, bandwidth_GBps: 448, alpha_us: 4.0}   # [spec] Infinity Fabric per GPU
  scaleout: {bandwidth_GBps: 50, alpha_us: 9.0}
runtime: {launch_overhead_us: 3.0}
