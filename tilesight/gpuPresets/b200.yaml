name: B200
arch: sm100
sms: 148
clock_ghz: 1.85
dies: 2
compute:
  tc_dense_tflops: {fp4: 9000, fp8: 4500, int8: 4500, bf16: 2250, fp16: 2250, tf32: 1125}
  tc_min_m: 64
  mma_latency_cycles: 64      # [calib] one tile MMA, issue-to-result
  cuda_latency_cycles: 4      # [calib]
  sfu_latency_cycles: 16      # [calib]
  cta_pair: true
  cluster_multicast: true   # [spec] thread-block clusters + TMA multicast
  cuda_fp32_tflops: 74.5
  sfu_tops: 4.7
efficiency: {tc: 0.92, cuda: 0.77, sfu: 0.95, ddr: 0.875, l2: 0.85, smem: 0.9}
memory:
  queueing: {coef: 0.5, max_factor: 3.0}   # [calib] M/D/1-style latency inflation
  outstanding: {per_sm_lines: 512}   # [calib] MSHR-style limit
  dma: {engines: 16, destination: smem}    # [calib] DMA ports per GPU (x memory.dma.port_bytes x clock)
  l1: {owner: cluster, capacity_KB: 256, smem_carveout_KB: 228, cluster_size: 2, cache_global_loads: true, capacity_derate: 1.0, bytes_per_clk: 128, latency_cycles: 20, policy: lru}   # derate 1.0 = no loss by default
  interleave_KB: 1       # [calib]
  addressing:            # dump with `tilesight addrmap`
    addr_bits: 48
    l2:  {ports: 16, mode: interleave, granularity_KB: 1}   # [calib]
    ddr: {ports: 8, mode: interleave, granularity_KB: 1}   # [calib/spec] one per stack
  ddr: {capacity_GB: 180, bandwidth_TBps: 8.0, latency_ns: 850}
  l2: {capacity_derate: 1.0, capacity_MB: 126, capacity_derate: 1.0, assoc: 16, bandwidth_TBps: 20.5, latency_ns: 350, per_sm_max_GBps: 180}
  onchip:
    smem: {capacity_KB: 228, bytes_per_clk: 128, latency_cycles: 30}
    tmem: {capacity_KB: 256, read_TBps: 16.0, write_TBps: 8.0, latency_cycles: 16}
load_paths:
  tma: {engine: dma, per_sm_bytes_per_clk: 118.92, latency_ns: 100, smem_direct: true, multicast: true, regs_per_thread: 0, issue_bytes_per_clk: 0}
  lsu: {engine: lsu, per_sm_bytes_per_clk: 75.68, latency_ns: 50, smem_direct: false, multicast: false, regs_per_thread: 16, issue_bytes_per_clk: 64}
occupancy: {max_blocks_per_sm: 32, max_threads_per_sm: 2048, regs_per_sm: 65536, max_regs_per_thread: 255}
network:
  nvlink: {domain_size: 8, bandwidth_GBps: 900, alpha_us: 3.0}
  scaleout: {bandwidth_GBps: 50, alpha_us: 8.0}
runtime: {launch_overhead_us: 2.0}
