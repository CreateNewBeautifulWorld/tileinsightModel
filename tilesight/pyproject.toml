[build-system]
requires = ["scikit-build-core>=0.9", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "tilesight"
version = "0.1.0"
description = "Tile-centric analytical GPU performance model (TileSight re-implementation) + LLM model-level simulator"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "openpyxl>=3.1", "reportlab>=4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tilesight = "tilesight.cli.cli:main"

[tool.scikit-build]
# Flat layout: this project's own root doubles as the "tilesight" package root (no separate
# src/ or python/ wrapper) - gpuTilingPerfHWModel/ sits right next to docs/, tests/, CLAUDE.md.
# scikit-build-core has no "the package root IS the project root" option; it only accepts a
# source path whose *last component* names the package (`Path(value).name == package_name`).
# Since this directory is itself named "tilesight" on disk, "../tilesight" satisfies that by
# going up to this directory's parent and back down into itself - self-referential, but it's
# the documented way to express this layout. Tested with `pip install -e . --no-build-isolation`.
wheel.packages = ["../tilesight"]
# Project-level files that live alongside the package but aren't part of it. CMakeLists.txt is
# deliberately NOT excluded: _core_builder.py auto-builds tilesight._core on first import if it
# isn't already there (e.g. a wheel installed on a platform with no matching prebuilt binary), and
# that only works if CMakeLists.txt actually ships with the installed package, not just in a git
# checkout.
wheel.exclude = ["docs/**", "tests/**", "examples/**", "*.md", "*.pdf", "*.toml", ".gitignore"]
sdist.include = ["html/*.html", "gpuPresets/*.yaml", "modelPresets/*"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
