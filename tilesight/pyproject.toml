[build-system]
requires = ["scikit-build-core>=0.9", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "tilesight"
version = "0.1.0"
description = "Tile-centric analytical GPU performance model (TileSight re-implementation) + LLM model-level simulator"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "openpyxl>=3.1", "reportlab>=4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tilesight = "tilesight.cli:main"

[tool.scikit-build]
wheel.packages = ["python/tilesight"]
sdist.include = ["python/tilesight/web/*.html", "python/tilesight/gpuTilingHWModel/db/*.yaml", "python/tilesight/model/presets/*"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
